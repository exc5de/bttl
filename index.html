<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MI 보증금 체크</title>
<style>
body{font-family:sans-serif;margin:0;padding:12px;max-width:480px;margin:auto}
h1{font-size:18px;margin:0 0 8px}
#box{position:relative;background:#000}
video{width:100%;display:block;max-height:45vh;object-fit:cover}
#line{position:absolute;left:5%;right:5%;top:50%;height:2px;background:red;opacity:.7}
button{font-size:16px;padding:12px;margin:6px 0;width:100%}
input{font-size:16px;padding:10px;width:100%;box-sizing:border-box}
#res{margin-top:10px;padding:16px;border:3px solid;text-align:center}
#res b{display:block;font-size:48px;margin:6px 0}
.yes{border-color:green;color:green}.no{border-color:red;color:red}.unk{border-color:orange;color:orange}.wait{border-color:gray;color:gray}
.two{display:flex;gap:8px}.two button{flex:1}
small{color:gray}
</style>
</head>
<body>
<h1>미시간 병/캔 보증금 (10¢)</h1>
<div id="box"><video id="v" playsinline muted autoplay></video><div id="line"></div></div>
<div id="st" style="font-size:12px;color:gray;margin:4px 0">엔진 로딩 중...</div>
<button id="start" style="display:none">카메라 켜기</button>
<div id="res" class="wait"><b>바코드를 빨간 선에 대세요</b></div>
<input id="manual" inputmode="numeric" placeholder="안 되면 번호 직접 입력" style="margin-top:10px">
<button id="go">확인</button>
<hr>
<small>
<b>환불 O (10¢):</b> 맥주, 탄산음료, 탄산수/스파클링, 콤부차, 캔 칵테일<br>
<b>환불 X:</b> 일반 생수, 주스, 우유, 와인, 양주(병), 비탄산 음료<br>
병/캔에 "MI 10¢" 표시가 있으면 확실. 다른 주에서 산 건 안 됨.
</small>

<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.0.1/dist/iife/ponyfill.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var last="",busy=false,det=null;

function mem(){try{return JSON.parse(localStorage.getItem("mi")||"{}")}catch(e){return{}}}
function save(c,v){try{var m=mem();m[c]=v;localStorage.setItem("mi",JSON.stringify(m))}catch(e){}}

// UPC-E(8자리, 캔/작은 제품)를 UPC-A(12자리)로 변환
function upcEtoA(s){
  var n=s[0],e=s.slice(1,7),c=s[7],a=e[0],b=e[1],cc=e[2],d=e[3],ee=e[4],f=e[5],body;
  if(f==="0"||f==="1"||f==="2")body=n+a+b+f+"0000"+cc+d+ee;
  else if(f==="3")body=n+a+b+cc+"00000"+d+ee;
  else if(f==="4")body=n+a+b+cc+d+"00000"+ee;
  else body=n+a+b+cc+d+ee+"0000"+f;
  return body+c;
}
function chk(s){ // UPC-A/EAN-13/EAN-8 체크섬
  var d=s.split("").map(Number),c=d.pop(),sum=0;
  for(var i=d.length-1,k=0;i>=0;i--,k++)sum+=d[i]*(k%2===0?3:1);
  return (10-sum%10)%10===c;
}
// 유효하면 정규화된 코드 반환, 아니면 null
function normCode(s){
  s=(s||"").trim();
  if(!/^\d+$/.test(s))return null;
  if(s.length===8){
    if((s[0]==="0"||s[0]==="1")){var u=upcEtoA(s);if(chk(u))return u}
    return chk(s)?s:null;
  }
  if(s.length===12||s.length===13)return chk(s)?s:null;
  return null;
}

async function lookup(code){
  try{
    var r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+code+".json?fields=product_name,categories_tags");
    var j=await r.json();
    if(j.status!==1)return null;
    var t=(j.product.categories_tags||[]).join(" ");
    var name=j.product.product_name||"";
    if(/beer|sodas|carbonated|sparkling|seltzer|kombucha|colas/.test(t))return{v:"yes",name:name};
    if(/waters|juices|milks|wines|spirits/.test(t))return{v:"no",name:name};
    return{v:"unk",name:name};
  }catch(e){return null}
}

function show(code,res,src){
  var el=$("res");
  var txt={yes:"환불 가능",no:"환불 불가",unk:"모르겠음"}[res.v];
  el.className=res.v;
  el.innerHTML="<small>"+code+(res.name?" "+res.name:"")+"</small><b>"+txt+"</b>"+
    (src?"<small>"+src+"</small>":"<small>병/캔의 'MI 10¢' 표시 확인</small>")+
    '<div class="two"><button data-v="yes">10¢ 있음</button><button data-v="no">없음</button></div>'+
    "<small>누르면 이 바코드를 기억해요</small>";
  var bs=el.querySelectorAll("button");
  for(var i=0;i<bs.length;i++)bs[i].onclick=function(){var v=this.getAttribute("data-v");save(code,v);show(code,{v:v,name:res.name},"내가 저장한 정보")};
}

async function check(code){
  code=code.trim();if(!code)return;
  var m=mem()[code];
  if(m)return show(code,{v:m},"내가 저장한 정보");
  var el=$("res");el.className="wait";el.innerHTML="<b>조회 중...</b>";
  var r=await lookup(code);
  show(code,r||{v:"unk"});
}

// ---- 카메라 + 연속 인식 ----
var cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});

async function startCam(){
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{
      facingMode:{ideal:"environment"},width:{ideal:3840},height:{ideal:2160},
      advanced:[{focusMode:"continuous"}]}});
    var v=$("v");v.srcObject=stream;v.setAttribute("playsinline","");v.muted=true;
    await v.play();
    $("start").style.display="none";
    var Det=(window.BarcodeDetectionAPI&&window.BarcodeDetectionAPI.BarcodeDetector)||window.BarcodeDetector;
    det=new Det({formats:["ean_13","upc_a","upc_e","ean_8"]});
    $("st").textContent="인식 중...";loop();
  }catch(e){
    $("start").style.display="block";
    $("res").className="unk";$("res").innerHTML="<b>카메라 안 열림</b><small>https 주소인지, Safari 카메라 권한 허용인지 확인 후 '카메라 켜기'</small>";
  }
}

var pass=0,frames=0;
function grab(v,mode){
  var w=v.videoWidth,h=v.videoHeight,sx=0,sy=0,sw=w,sh=h,max=1600;
  if(mode===1){ // 가운데 60% 원본 해상도 (멀리/작은 바코드)
    sw=Math.round(w*0.6);sh=Math.round(h*0.6);sx=Math.round((w-sw)/2);sy=Math.round((h-sh)/2);max=1600;
  }else if(mode===2){ // 가운데 가로띠
    sh=Math.round(h*0.4);sy=Math.round((h-sh)/2);max=1600;
  }
  var sc=Math.min(1,max/Math.max(sw,sh));
  cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);
  cx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
  return cv;
}
async function loop(){
  var v=$("v");
  if(!busy&&v.videoWidth&&v.readyState>=2){
    busy=true;
    try{
      var out=await det.detect(grab(v,pass%3));
      pass++;frames++;
      if(frames%5===0)$("st").textContent="인식 중... ("+v.videoWidth+"x"+v.videoHeight+", "+frames+"회 분석)";
      for(var i=0;i<out.length;i++){
        var c=normCode(out[i].rawValue);
        if(c&&c!==last){last=c;if(navigator.vibrate)navigator.vibrate(60);check(c);break}
      }
    }catch(e){$("st").textContent="인식 오류: "+e}
    busy=false;
  }
  requestAnimationFrame(loop);
}

$("start").onclick=startCam;
$("go").onclick=function(){var c=normCode($("manual").value)||$("manual").value.trim();last=c;check(c)};
startCam();
</script>
</body>
</html>
